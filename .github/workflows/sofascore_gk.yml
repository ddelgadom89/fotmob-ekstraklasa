name: Sofascore porteros Ekstraklasa

on:
  schedule:
    - cron: "0 7 * * 2"   # martes 07:00 UTC (tras la jornada del fin de semana + lunes)
  workflow_dispatch:       # botón para lanzarlo a mano

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install curl_cffi pandas

      - name: Scraping Sofascore
        run: python scrape_sofascore_gk.py

      - name: Commit de los CSV
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/sofascore_gk_*.csv
          git diff --staged --quiet || git commit -m "Sofascore porteros $(date +'%Y-%m-%d')"
          git push
