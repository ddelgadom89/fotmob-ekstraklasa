name: Actualizar FotMob Ekstraklasa

on:
  schedule:
    - cron: "0 6 * * 2"   # Martes 06:00 UTC (tras la jornada del fin de semana)
  workflow_dispatch:       # Botón para lanzarlo a mano

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pandas

      - run: python scrape_fotmob.py

      - name: Guardar CSV en el repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Actualización FotMob $(date +'%Y-%m-%d')"
          git push
